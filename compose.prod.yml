# Production stack for one server: PostgreSQL, API, web app, HTTPS reverse proxy, daily backups.
#   cp .env.production.example .env.production   (then fill it in)
#   docker compose --env-file .env.production -f compose.prod.yml up -d --build
# Full steps, updates and restore: "Run it on a server" in README.md

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: radcore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: radcore
      TZ: Asia/Kolkata
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U radcore -d radcore']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://radcore:${POSTGRES_PASSWORD}@db:5432/radcore
      WEB_ORIGIN: https://${DOMAIN:?set DOMAIN in .env.production}
      COOKIE_SECURE: 'true'
      # The API sits behind exactly one proxy (Caddy), so the caller's real address is one hop back.
      TRUST_PROXY: 1
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
      SEED_ADMIN_PHONE: ${SEED_ADMIN_PHONE:?set SEED_ADMIN_PHONE in .env.production}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      UPLOAD_DIR: /data/uploads
      # Orders from the Shopify store (blank = not connected)
      SHOPIFY_WEBHOOK_SECRET: ${SHOPIFY_WEBHOOK_SECRET:-}
      # Optional "are you a person" check on the public enquiry form (Cloudflare Turnstile). Blank = off.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      # A review copy: load sample data into an empty database, with DEMO_PASSWORD on the review sign-ins.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      # Lead capture from Meta (Facebook / Instagram lead ads, WhatsApp). Blank = not connected.
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}
      # Sending WhatsApp messages from inside the app (blank = not connected)
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}

    volumes:
      - uploads_data:/data/uploads

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: radcore
      PGDATABASE: radcore
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Kolkata
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - uploads_data:/uploads:ro
    entrypoint: ['/bin/bash', '/backup.sh']

volumes:
  uploads_data:
  db_data:
  caddy_data:
  caddy_config:
