# Production stack for one server: PostgreSQL, API, web app, HTTPS reverse proxy, daily backups.
#   cp .env.production.example .env.production   (then fill it in)
#   docker compose --env-file .env.production -f compose.prod.yml up -d --build
# Full steps, updates and restore: "Run it on a server" in README.md

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: radcore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: radcore
      TZ: Asia/Kolkata
      # The login the API uses: rows only, no CREATE, ALTER or DROP (deploy/db-app-user.sh, brief P3).
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env.production}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./deploy/db-app-user.sh:/docker-entrypoint-initdb.d/20-app-user.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U radcore -d radcore']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      # Least privilege: the API works as radcore_app; only the migrations at start use the owner.
      DATABASE_URL: postgres://radcore_app:${APP_DB_PASSWORD}@db:5432/radcore
      MIGRATION_DATABASE_URL: postgres://radcore:${POSTGRES_PASSWORD}@db:5432/radcore
      WEB_ORIGIN: https://${DOMAIN:?set DOMAIN in .env.production}
      COOKIE_SECURE: 'true'
      # The API sits behind exactly one proxy (Caddy), so the caller's real address is one hop back.
      TRUST_PROXY: 1
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
      SEED_ADMIN_PHONE: ${SEED_ADMIN_PHONE:?set SEED_ADMIN_PHONE in .env.production}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      UPLOAD_DIR: /data/uploads
      # Orders from the Shopify store (blank = not connected)
      SHOPIFY_WEBHOOK_SECRET: ${SHOPIFY_WEBHOOK_SECRET:-}
      APP_SECRET: ${APP_SECRET:-}
      BANK_MAIL_HOST: ${BANK_MAIL_HOST:-}
      BANK_MAIL_PORT: ${BANK_MAIL_PORT:-993}
      BANK_MAIL_USER: ${BANK_MAIL_USER:-}
      BANK_MAIL_PASSWORD: ${BANK_MAIL_PASSWORD:-}
      BANK_MAIL_FOLDER: ${BANK_MAIL_FOLDER:-INBOX}
      BANK_MAIL_CRON_SECRET: ${BANK_MAIL_CRON_SECRET:-}
      # Where problems are reported (blank = only on Admin > System health). The API runs its own background jobs.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      DOMAIN: ${DOMAIN}
      # Optional "are you a person" check on the public enquiry form (Cloudflare Turnstile). Blank = off.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      # A review copy: load sample data into an empty database, with DEMO_PASSWORD on the review sign-ins.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      # Lead capture from Meta (Facebook / Instagram lead ads, WhatsApp). Blank = not connected.
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}
      # Sending WhatsApp messages from inside the app (blank = not connected)
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}

    volumes:
      - uploads_data:/data/uploads

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    build:
      context: .
      dockerfile: deploy/backup.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: radcore
      PGDATABASE: radcore
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Kolkata
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      # Off-site copies (blank = none): an S3 bucket in Mumbai and a key that may only put files in it.
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-1}
      # Every backup encrypted with this key (blank = not encrypted), and failures reported here.
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - uploads_data:/uploads:ro
    entrypoint: ['/bin/bash', '/backup.sh']

volumes:
  uploads_data:
  db_data:
  caddy_data:
  caddy_config:
